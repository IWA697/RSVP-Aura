<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benitta's</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- EFEK TRANSISI AWAN -->
    <div id="cloud-transition" class="cloud-overlay hidden">
        <img src="assets/images/awan.png" class="cloud cloud-left" alt="Awan Kiri">
        <img src="assets/images/awan.png" class="cloud cloud-right" alt="Awan Kanan">
    </div>

    <!-- AUDIO PLAYER DAN TOMBOL MUSIK -->
    <audio id="bg-music" loop autoplay>
        <source src="assets/audio/bgm.mp3" type="audio/mpeg">
    </audio>
    <div id="music-container" class="music-container hidden">
        <img src="assets/images/music-button.png" alt="Toggle Music">
    </div>

    <!-- TAMPILAN 1: WELCOME (FULL SCREEN OVERLAY) -->
    <div id="view-1-welcome" class="view-section full-screen-overlay">

        <!-- Ornamen Gambar -->
        <img src="assets/images/rumput.png" class="ornament rumput" alt="rumput">
        <img src="assets/images/bunga1.png" class="ornament bunga-kiri" alt="bunga kiri">
        <img src="assets/images/bunga2.png" class="ornament bunga-kanan" alt="bunga kanan">
        <img src="assets/images/kupu-kupu1.png" class="ornament kupu-kupu-1" alt="kupu-kupu 1">
        <img src="assets/images/kupu-kupu2.png" class="ornament kupu-kupu-2" alt="kupu-kupu 2">

        <!-- Teks dan Tombol -->
        <div class="welcome-content">
            <svg class="arched-text" viewBox="0 0 800 150">
                <path id="curve" d="M 50 140 Q 400 30 750 140" fill="transparent" />
                <text>
                    <textPath href="#curve" startOffset="50%" text-anchor="middle">
                        YOU'RE INVITED TO
                    </textPath>
                </text>
            </svg>
            <h1 class="nama-ulang-tahun">BENITTA'S</h1>
            <h2 class="sub-judul">SWEET 17TH BIRTHDAY PARTY</h2>
            <br><br>
            <button type="button" id="btn-lanjut-1" class="btn-coklat">NEXT</button>
        </div>
    </div>

    <form id="form-rsvp">

        <!-- TAMPILAN 2: RSVP & EVENT INFO (FULL SCREEN OVERLAY) -->
        <div id="view-2-rsvp" class="view-section full-screen-overlay hidden">

            <!-- Tombol Kembali -->
            <img src="assets/images/back-button.png" id="btn-back-to-1" class="back-button" alt="Kembali">
            <!-- Ornamen Gambar Latar RSVP Baru -->
            <img src="assets/images/rumput.png" class="ornament rumput" alt="rumput">
            <img src="assets/images/pagar.png" class="ornament pagar-kiri" alt="pagar kiri">
            <img src="assets/images/bunga3.png" class="ornament bunga3-kiri" alt="bunga kiri">
            <img src="assets/images/kupu-kupu1.png" class="ornament kupu-rsvp" alt="kupu kupu">
            <img src="assets/images/rumput2.png" class="ornament rumput2-kanan" alt="rumput kanan">
            <img src="assets/images/cloud1.png" class="ornament awan-kiri" alt="awan kiri">
            <img src="assets/images/cloud2.png" class="ornament awan-kanan" alt="awan kanan">

            <div class="rsvp-content">
                <h1 class="event-title">WILL BE HELD</h1>

                <div class="event-details">
                    <p><img src="assets/images/calendar.png" class="icon-img" alt="calendar"> 18TH JULY 2026</p>
                    <p><img src="assets/images/location.png" class="icon-img" alt="location"> WALKING DRUMS</p>
                    <p><a href="https://www.google.com/maps/search/?api=1&query=Walking+Drums" target="_blank"
                            class="maps-link">CLICK HERE!</a></p>
                    <p><img src="assets/images/clock.png" class="icon-img" alt="clock"> 17.00 PM</p>
                    <p><img src="assets/images/clothes.png" class="icon-img" alt="dresscode">
                        <span>EARTH TONE</span>
                    </p>

                </div>

                <div class="rsvp-form-area">
                    <input type="text" id="nama" name="nama" placeholder="Your Name" class="input-nama-rsvp">
                    <input type="hidden" id="kehadiran-hidden" name="kehadiran" value="">

                    <button type="button" id="btn-hadir" class="btn-rsvp">Yes, I'll be there!</button>
                    <button type="button" id="btn-tidak-hadir" class="btn-rsvp">Sorry, can't make it</button>

                    <button type="button" id="btn-action" class="btn-rsvp btn-action">NEXT</button>
                </div>
            </div>
        </div>

        <!-- TAMPILAN 3: PILIH MAKANAN (Hanya jika "Hadir") (FULL SCREEN OVERLAY) -->
        <div id="view-3-food" class="view-section full-screen-overlay hidden">

            <!-- Tombol Kembali -->
            <img src="assets/images/back-button.png" id="btn-back-to-2" class="back-button" alt="Kembali">

            <!-- Kontainer untuk efek kelopak bunga jatuh -->
            <div id="petal-container"></div>

            <div class="food-menu-container">
                <h2 class="food-menu-title">PICK YOUR MAIN COURSE!</h2>
                <div class="food-grid">
                    <label class="food-card">
                        <input type="radio" name="makanan" value="Spaghetti Aglio Olio">
                        <img src="assets/images/menu1.png" alt="Spaghetti Aglio O'lio">
                        <span class="food-name">SPAGHETTI AGLIO O'LIO</span>
                    </label>
                    <label class="food-card">
                        <input type="radio" name="makanan" value="Fettucinne Carbonara">
                        <img src="assets/images/menu2.png" alt="Fettucinne Carbonara">
                        <span class="food-name">FETTUCINNE CARBONARA</span>
                    </label>
                    <label class="food-card">
                        <input type="radio" name="makanan" value="Spicy Chicken Burger">
                        <img src="assets/images/menu3.png" alt="Spicy Chicken Burger">
                        <span class="food-name">SPICY CHICKEN BURGER</span>
                    </label>
                    <label class="food-card">
                        <input type="radio" name="makanan" value="Nasi Ayam Bumbu Rujak">
                        <img src="assets/images/menu4.png" alt="Nasi Ayam Bumbu Rujak">
                        <span class="food-name">NASI AYAM BUMBU RUJAK</span>
                    </label>
                    <label class="food-card">
                        <input type="radio" name="makanan" value="Nasi Empal Gentong">
                        <img src="assets/images/menu5.png" alt="Nasi Empal Gentong">
                        <span class="food-name">NASI EMPAL GENTONG</span>
                    </label>
                    <label class="food-card">
                        <input type="radio" name="makanan" value="Nasi Goreng Kampoeng">
                        <img src="assets/images/menu6.png" alt="Nasi Goreng Kampoeng">
                        <span class="food-name">NASI GORENG KAMPOENG</span>
                    </label>
                </div>
                <button type="button" id="tombol-kirim" class="btn-coklat mt-20">CONFIRM!</button>
            </div>
        </div>

        <!-- TAMPILAN 4: THANK YOU (FULL SCREEN OVERLAY) -->
        <div id="view-4-thankyou" class="view-section full-screen-overlay hidden">
            <!-- Kontainer untuk efek kelopak bunga jatuh -->
            <div id="petal-container-2"></div>

            <!-- Background Ornaments (Sama seperti laman RSVP) -->
            <img src="assets/images/rumput.png" class="ornament rumput" alt="rumput">
            <img src="assets/images/cloud1.png" class="ornament awan-kiri" alt="awan kiri">
            <img src="assets/images/cloud2.png" class="ornament awan-kanan" alt="awan kanan">

            <div class="thankyou-container">
                <!-- Baris Atas (Geser Kanan) -->
                <div class="scrolling-row top-row">
                    <div class="scroll-track track-right">
                        <!-- Set 1 -->
                        <img src="assets/images/aura_atas_1.png" alt="Foto Atas 1">
                        <img src="assets/images/aura_atas_2.png" alt="Foto Atas 2">
                        <img src="assets/images/aura_atas_3.png" alt="Foto Atas 3">
                        <img src="assets/images/aura_atas_4.png" alt="Foto Atas 4">
                        <img src="assets/images/aura_atas_5.png" alt="Foto Atas 5">
                        <!-- Duplikat untuk infinite scroll -->
                        <img src="assets/images/aura_atas_1.png" alt="Foto Atas 1">
                        <img src="assets/images/aura_atas_2.png" alt="Foto Atas 2">
                        <img src="assets/images/aura_atas_3.png" alt="Foto Atas 3">
                        <img src="assets/images/aura_atas_4.png" alt="Foto Atas 4">
                        <img src="assets/images/aura_atas_5.png" alt="Foto Atas 5">
                    </div>
                </div>

                <!-- Teks Tengah -->
                <div class="thankyou-text">
                    <h1>THANK YOU</h1>
                    <div id="pesan-status">Konfirmasi Anda telah kami catat.</div>
                </div>

                <!-- Baris Bawah (Geser Kiri) -->
                <div class="scrolling-row bottom-row">
                    <div class="scroll-track track-left">
                        <!-- Set 1 -->
                        <img src="assets/images/aura_bawah_1.png" alt="Foto Bawah 1">
                        <img src="assets/images/aura_bawah_2.png" alt="Foto Bawah 2">
                        <img src="assets/images/aura_bawah_3.png" alt="Foto Bawah 3">
                        <img src="assets/images/aura_bawah_4.png" alt="Foto Bawah 4">
                        <img src="assets/images/aura_bawah_5.png" alt="Foto Bawah 5">
                        <!-- Duplikat untuk infinite scroll -->
                        <img src="assets/images/aura_bawah_1.png" alt="Foto Bawah 1">
                        <img src="assets/images/aura_bawah_2.png" alt="Foto Bawah 2">
                        <img src="assets/images/aura_bawah_3.png" alt="Foto Bawah 3">
                        <img src="assets/images/aura_bawah_4.png" alt="Foto Bawah 4">
                        <img src="assets/images/aura_bawah_5.png" alt="Foto Bawah 5">
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="js/script.js"></script>

</body>

</html>
